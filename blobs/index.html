<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8">
    <title>Blobs</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Blobs" />
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111418;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      #start {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: rgba(10, 12, 16, 0.85);
        color: #fff; text-align: center;
      }
      #start h1 { font-size: 15vw; margin: 0 0 2vh; }
      #start p { opacity: 0.7; font-size: 4.5vw; margin: 0.6vh 8vw; }
      #start .go {
        margin-top: 4vh; padding: 3vw 9vw;
        border-radius: 99px; background: #ffd166; color: #111;
        font-weight: 700; font-size: 6vw;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="start">
      <h1>Blobs</h1>
      <p>Tilt your phone to pour them around.</p>
      <p>Drag a blob to fling it. Tap empty space for a new one.</p>
      <p>Double-tap a blob to pop it.</p>
      <div class="go">Tap to start</div>
    </div>
    <script src="blobs.js"></script>
  </body>
</html>
